<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -170 300 340">
  <defs>
    <radialGradient id="azul" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#8fb0dc"/>
      <stop offset="1" stop-color="#4f78b8"/>
    </radialGradient>
  </defs>
  <!-- rayos largos (cuatro puntas) -->
  <g fill="#f3f6fb">
    <polygon points="-145,0 -20,-6 -20,6"/>
    <polygon points="145,0 20,-6 20,6"/>
    <polygon points="0,150 -6,30 6,30"/>
  </g>
  <!-- rayos cortos alrededor -->
  <g fill="#f3f6fb">
    <g id="rayo"><polygon points="0,-95 -9,-50 9,-50"/></g>
    <use href="#rayo" transform="rotate(30)"/>
    <use href="#rayo" transform="rotate(60)"/>
    <use href="#rayo" transform="rotate(90)"/>
    <use href="#rayo" transform="rotate(120)"/>
    <use href="#rayo" transform="rotate(150)"/>
    <use href="#rayo" transform="rotate(180)"/>
    <use href="#rayo" transform="rotate(210)"/>
    <use href="#rayo" transform="rotate(240)"/>
    <use href="#rayo" transform="rotate(270)"/>
    <use href="#rayo" transform="rotate(300)"/>
    <use href="#rayo" transform="rotate(330)"/>
  </g>
  <!-- cruz -->
  <g fill="#e9eef7" stroke="#9fb3d1" stroke-width="1">
    <rect x="-5" y="-135" width="10" height="42" rx="2"/>
    <rect x="-17" y="-125" width="34" height="9" rx="2"/>
    <circle cx="0" cy="-135" r="5"/>
    <circle cx="-17" cy="-120" r="4"/>
    <circle cx="17" cy="-120" r="4"/>
  </g>
  <!-- corazón con encaje -->
  <path d="M0,62 C-70,12 -78,-40 -42,-52 C-20,-58 -6,-44 0,-34 C6,-44 20,-58 42,-52 C78,-40 70,12 0,62 Z"
        fill="#f6f1e4" stroke="#b9c7de" stroke-width="3" stroke-dasharray="3 3"/>
  <path d="M0,50 C-58,10 -64,-32 -36,-42 C-18,-47 -5,-36 0,-26 C5,-36 18,-47 36,-42 C64,-32 58,10 0,50 Z"
        fill="url(#azul)" stroke="#f6f1e4" stroke-width="5"/>
  <path d="M0,50 C-58,10 -64,-32 -36,-42 C-18,-47 -5,-36 0,-26 C5,-36 18,-47 36,-42 C64,-32 58,10 0,50 Z"
        fill="none" stroke="#6d8fc4" stroke-width="1" stroke-dasharray="1 3"/>
</svg>
